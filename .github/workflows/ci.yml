name: CI

on:
    pull_request: ~
    push:
        branches:
            - '*'
        tags:
            - '*'

jobs:
    cs:
        name: Coding Style
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install ecs
                run: composer update --working-dir=tools/ecs --no-interaction --no-progress

            -   name: Run the CS fixer
                run: composer cs-fixer

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.4
                    extensions: dom, fileinfo, filter, ftp, gd, hash, imagick, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
                    coverage: none
                env:
                    COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install the dependencies
                run: |
                    composer update --no-interaction --no-progress
                    composer update --working-dir=tools/phpstan --no-interaction --no-progress

            -   name: Run PHPStan
                run: composer phpstan

    tests:
        name: PHP ${{ matrix.php }} / Contao ${{ matrix.contao }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   php: 8.4
                        contao: 5.3.*
                    -   php: 8.5
                        contao: 5.3.*
                    -   php: 8.4
                        contao: 5.7.*
                    # Contao 6.0 cannot be installed yet: codefog/contao-haste, menatwork/contao-multicolumnwizard-bundle,
                    # terminal42/notification_center and terminal42/contao-mp_forms do not support it so far.
        steps:
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: dom, fileinfo, filter, ftp, gd, hash, imagick, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
                    coverage: none

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Install the dependencies
                run: |
                    composer require contao/core-bundle:${{ matrix.contao }} contao/calendar-bundle:${{ matrix.contao }} contao/newsletter-bundle:${{ matrix.contao }} --no-update --no-interaction
                    composer update --no-interaction --no-progress

            -   name: Run the unit tests
                run: composer unit-tests
